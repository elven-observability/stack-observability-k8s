name: Elven OCI supply chain

on:
  pull_request:
    paths: ['images/**', 'scripts/images-*.py', 'scripts/images-*.sh', 'versions.lock.json', '.github/workflows/images.yaml']
  push:
    tags: ['v1.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  KUBECONFIG: /dev/null
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: elven-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Use a pinned Docker engine with native OCI/attestation image storage
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          version: v29.9.2
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - id: builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
      - name: Inspect disposable CI runner storage before building
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          docker system df
      - name: Validate locks and build both architectures without publishing
        timeout-minutes: 30
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 scripts/images-release.py check
          version=1.0.0-dev
          if [[ "$RELEASE_REF" =~ ^refs/tags/v1\.[0-9]+\.[0-9]+$ ]]; then
            version="${RELEASE_REF#refs/tags/}"
          fi
          python3 scripts/images-release.py build --version "$version" --platform linux/amd64,linux/arm64
      - name: Reclaim only this disposable CI builder cache and verify preserved OCI archives
        if: success()
        env:
          ELVEN_CI_BUILDER: ${{ steps.builder.outputs.name }}
        run: |
          test -n "$ELVEN_CI_BUILDER"
          test -s artifacts/images/release.json
          docker buildx prune --builder "$ELVEN_CI_BUILDER" --all --force
          python3 - <<'PY'
          import hashlib, json, pathlib
          directory = pathlib.Path("artifacts/images")
          manifest = json.loads((directory / "release.json").read_text())
          assert set(manifest["images"]) == {"collector", "beyla", "alloy"}, "Missing OCI exports"
          for name, image in manifest["images"].items():
              with (directory / image["archive"]).open("rb") as source:
                  digest = hashlib.file_digest(source, "sha256").hexdigest()
              assert digest == image["archiveSha256"], f"{name}: OCI archive changed during cache cleanup"
          print("All three exported OCI archives preserved with unchanged SHA-256")
          PY
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          docker system df
      - name: Gate every runtime/architecture on HIGH and CRITICAL vulnerabilities
        run: python3 scripts/images-release.py scan
      - name: Load the exact scanned Collector and profiler archives and select immutable references
        run: |
          docker load --input artifacts/images/collector.oci.tar
          docker load --input artifacts/images/alloy.oci.tar
          python3 - <<'PY'
          import json, os
          manifest = json.load(open("artifacts/images/release.json"))
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for component, key in (("collector", "ELVEN_COLLECTOR_IMAGE"), ("alloy", "ELVEN_ALLOY_IMAGE")):
                  image = manifest["images"][component]
                  output.write(key + "=" + image["tag"] + "@" + image["digest"] + "\n")
          PY
      - name: Check Go vulnerable-symbol presence in both exact Collector binaries
        run: python3 scripts/images-release.py govulncheck
      - name: Install pinned synthetic runtime and lifecycle test tooling
        run: |
          python3 -m pip install PyYAML==6.0.3 jsonschema==4.26.0 opentelemetry-proto==1.45.1 protobuf==7.36.2
          bash scripts/images-install-ci-tools.sh
      - name: Validate the actual Elven binary with rendered configurations and HTTPS profiling
        run: python3 scripts/validate.py --runtime
      - name: Native amd64 install, delivery, outage/replay, coexistence, upgrade and rollback of the scanned image
        run: >-
          python3 scripts/test-kind.py
          --development-images
          --collector-image "$ELVEN_COLLECTOR_IMAGE"
          --collector-image-archive artifacts/images/collector.oci.tar
          --node-image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      - name: Preserve OCI archives, BuildKit SBOM/provenance and complete scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elven-oci-release
          path: artifacts/images
          if-no-files-found: error
          retention-days: 7
      - name: Preserve sanitized runtime and lifecycle evidence separately
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elven-runtime-evidence
          include-hidden-files: true
          path: |
            .artifacts/validation-*/report.json
            .artifacts/kind-*/report.json
            .artifacts/kind-*/diagnostics.txt
          if-no-files-found: warn
          retention-days: 7

  publish:
    # No PR, branch push or default-branch manual dispatch may publish.
    if: startsWith(github.ref, 'refs/tags/v1.')
    needs: build-and-scan
    environment: elven-distribution-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse an absent or unprotected release environment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/$RELEASE_REPOSITORY/environments/elven-distribution-release" \
            --jq '.protection_rules | any(.type == "required_reviewers" and (.reviewers | length > 0))' \
            | grep -qx true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: elven-oci-release
          path: artifacts/images
      - name: Install the checksum-pinned registry client
        run: |
          crane_url=$(python3 -c 'import json; print(json.load(open("versions.lock.json"))["tools"]["crane"]["linuxAmd64"]["url"])')
          crane_sha=$(python3 -c 'import json; print(json.load(open("versions.lock.json"))["tools"]["crane"]["linuxAmd64"]["sha256"])')
          mkdir -p "$RUNNER_TEMP/elven-tools"
          curl --fail --location --retry 3 "$crane_url" --output "$RUNNER_TEMP/elven-tools/crane.tar.gz"
          printf '%s  %s\n' "$crane_sha" "$RUNNER_TEMP/elven-tools/crane.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/elven-tools/crane.tar.gz" -C "$RUNNER_TEMP/elven-tools" crane
          echo "$RUNNER_TEMP/elven-tools" >> "$GITHUB_PATH"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Refuse missing registry credentials
        env:
          REGISTRY_USER: ${{ secrets.ELVEN_DOCKERHUB_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.ELVEN_DOCKERHUB_TOKEN }}
        run: test -n "$REGISTRY_USER" && test -n "$REGISTRY_TOKEN"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: docker.io
          username: ${{ secrets.ELVEN_DOCKERHUB_USERNAME }}
          password: ${{ secrets.ELVEN_DOCKERHUB_TOKEN }}
      - name: Publish exactly the scanned bytes and sign/verify with GitHub OIDC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/images-release.py publish
          python3 scripts/images-release.py promote
      - name: Preserve verified digests and promotion candidate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elven-oci-promotion
          path: artifacts/images/*.json
          if-no-files-found: error
          retention-days: 30
