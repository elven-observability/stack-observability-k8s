name: Verify published Elven images

on:
  pull_request:
    paths: ['versions.lock.json', 'instrumentation.lock.json', 'scripts/images-*.py', '.github/workflows/verify-published.yaml']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  KUBECONFIG: /dev/null
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.locks.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: locks
        run: |
          python3 - <<'PY'
          import json, os
          locks = [json.load(open(path)) for path in ('versions.lock.json', 'instrumentation.lock.json')]
          ready = all(lock['distribution']['publicationStatus'] == 'verified' for lock in locks)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('ready=' + str(ready).lower(), file=output)
          print('Published-lock verification eligible: ' + str(ready))
          print('An unpublished candidate is not a passed registry/signature check.')
          PY

  verify:
    needs: publication
    if: needs.publication.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {family: core, component: collector}
          - {family: core, component: beyla}
          - {family: core, component: alloy}
          - {family: sdk, component: operator}
          - {family: sdk, component: java}
          - {family: sdk, component: nodejs}
          - {family: sdk, component: nodejs20}
          - {family: sdk, component: python}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - id: tools
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          python3 - <<'PY'
          import json, os, re
          path = 'instrumentation.lock.json' if os.environ['FAMILY'] == 'sdk' else 'versions.lock.json'
          tools = json.load(open(path))['tools']
          crane = tools['crane']['linuxAmd64']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', tools['cosign'])
          assert re.fullmatch(r'https://github.com/google/go-containerregistry/releases/download/v[0-9]+\.[0-9]+\.[0-9]+/go-containerregistry_Linux_x86_64.tar.gz', crane['url'])
          assert re.fullmatch(r'[0-9a-f]{64}', crane['sha256'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('cosign=v' + tools['cosign'], file=output)
              print('crane_url=' + crane['url'], file=output)
              print('crane_sha=' + crane['sha256'], file=output)
          PY
      - name: Install checksum-pinned registry client
        env:
          CRANE_URL: ${{ steps.tools.outputs.crane_url }}
          CRANE_SHA: ${{ steps.tools.outputs.crane_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/elven-public-verification"
          curl --fail --silent --show-error --location --retry 3 "$CRANE_URL" --output "$RUNNER_TEMP/elven-public-verification/crane.tar.gz"
          printf '%s  %s\n' "$CRANE_SHA" "$RUNNER_TEMP/elven-public-verification/crane.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/elven-public-verification/crane.tar.gz" -C "$RUNNER_TEMP/elven-public-verification" crane
          printf '%s\n' "$RUNNER_TEMP/elven-public-verification" >> "$GITHUB_PATH"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: ${{ steps.tools.outputs.cosign }}
      - name: Verify anonymous signature and exact SPDX/build predicates
        env:
          FAMILY: ${{ matrix.family }}
          COMPONENT: ${{ matrix.component }}
        run: |
          if [ "$FAMILY" = sdk ]; then
            python3 scripts/images-instrumentation.py verify --component "$COMPONENT"
          else
            python3 scripts/images-release.py verify --component "$COMPONENT"
          fi
      - name: Record only the successfully verified public reference
        env:
          FAMILY: ${{ matrix.family }}
          COMPONENT: ${{ matrix.component }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          path = 'instrumentation.lock.json' if os.environ['FAMILY'] == 'sdk' else 'versions.lock.json'
          image = json.load(open(path))['images'][os.environ['COMPONENT']]['distribution']
          report = {'result': 'PASS', 'family': os.environ['FAMILY'], 'component': os.environ['COMPONENT'],
                    'reference': image['repository'] + '@' + image['digest'], 'tag': image['tag'],
                    'sourceRevision': image['sourceRevision'], 'attestations': image['attestations'],
                    'customer_cluster_access': False, 'registry_authentication': 'anonymous'}
          directory = pathlib.Path('.artifacts/published-verification')
          directory.mkdir(parents=True, exist_ok=True)
          (directory / 'report.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: elven-public-${{ matrix.family }}-${{ matrix.component }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .artifacts/published-verification/report.json
          if-no-files-found: warn
          retention-days: 30
