name: Elven opt-in SDK supply chain

on:
  pull_request:
    paths: ['operator/**', 'images/operator/**', 'images/autoinstrumentation/**', 'instrumentation.lock.json', 'charts/elven-instrumentation/**', 'scripts/instrumentation.py', 'scripts/images-instrumentation.py', 'scripts/images-release.py', 'scripts/images-install-ci-tools.sh', 'scripts/validate-instrumentation.py', 'scripts/test-instrumentation-kind.py', 'tests/test_instrumentation*.py', 'tests/instrumentation-fixtures/**', '.github/workflows/instrumentation.yaml']
  push:
    tags: ['v1.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  KUBECONFIG: /dev/null
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: elven-instrumentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          version: v29.9.2
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - id: builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver-opts: image=docker.io/moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
          buildkitd-flags: --oci-worker-gc
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
      - name: Build independent Operator and four SDK images, including pinned Go unit tests
        timeout-minutes: 30
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          docker system df
          python3 scripts/images-instrumentation.py check
          version=1.0.0-dev
          if [[ "$RELEASE_REF" =~ ^refs/tags/v1\.[0-9]+\.[0-9]+$ ]]; then
            version="${RELEASE_REF#refs/tags/}"
          fi
          python3 scripts/images-instrumentation.py build --version "$version" --platform linux/amd64,linux/arm64
      - name: Reclaim only this CI builder and verify all five exported OCI checksums
        if: success()
        env:
          ELVEN_CI_BUILDER: ${{ steps.builder.outputs.name }}
        run: |
          test -n "$ELVEN_CI_BUILDER"
          test -s artifacts/instrumentation/instrumentation-release.json
          docker buildx prune --builder "$ELVEN_CI_BUILDER" --all --force
          python3 - <<'PY'
          import hashlib, json, pathlib
          folder = pathlib.Path("artifacts/instrumentation")
          manifest = json.loads((folder / "instrumentation-release.json").read_text())
          assert set(manifest["images"]) == {"operator", "java", "nodejs", "nodejs20", "python"}
          for name, image in manifest["images"].items():
              with (folder / image["archive"]).open("rb") as source:
                  assert hashlib.file_digest(source, "sha256").hexdigest() == image["archiveSha256"], name
          print("All five SDK/operator archives preserved with unchanged SHA-256")
          PY
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          docker system df
      - name: Require fresh HIGH and CRITICAL gates for both architectures of every image
        run: python3 scripts/images-instrumentation.py scan
      - name: Load only the exact scanned OCI images and expose their immutable local references
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          folder = pathlib.Path("artifacts/instrumentation")
          manifest = json.loads((folder / "instrumentation-release.json").read_text())
          keys = {"operator": "ELVEN_OPERATOR_IMAGE", "java": "ELVEN_AUTO_JAVA_IMAGE", "nodejs": "ELVEN_AUTO_NODEJS_IMAGE", "nodejs20": "ELVEN_AUTO_NODEJS20_IMAGE", "python": "ELVEN_AUTO_PYTHON_IMAGE"}
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for name, key in keys.items():
                  image = manifest["images"][name]
                  subprocess.run(["docker", "load", "--input", str(folder / image["archive"])], check=True)
                  output.write(key + "=" + image["tag"] + "@" + image["digest"] + "\n")
          PY
      - name: Install pinned structural and native injection test tooling
        run: |
          python3 -m pip install --requirement requirements-test.txt
          bash scripts/images-install-ci-tools.sh
      - name: Validate scoped opt-in contracts, Helm lint and all maintained schemas
        run: python3 scripts/validate-instrumentation.py
      - name: Check real TLS runtime fixtures without a cluster
        run: python3 -m unittest discover -s tests/instrumentation-fixtures -p test_fixtures.py -v
      - name: Native amd64 injection and actual SDK telemetry with the scanned archives
        run: >-
          python3 scripts/test-instrumentation-kind.py
          --images-manifest artifacts/instrumentation/instrumentation-release.json
          --development-images
      - name: Preserve independent SDK OCI, SPDX, scans and BuildKit provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elven-instrumentation-oci
          path: artifacts/instrumentation
          if-no-files-found: error
          retention-days: 7
      - name: Preserve only sanitized validation and injection evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elven-instrumentation-runtime-evidence
          include-hidden-files: true
          path: |
            .artifacts/instrumentation-validation-*/report.json
            .artifacts/instrumentation-kind-*/report.json
            .artifacts/instrumentation-kind-*/sdk-diagnostics.txt
          if-no-files-found: warn
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v1.') && !contains(github.ref, '-')
    needs: build-and-test
    environment: elven-distribution-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse an absent or unprotected publication environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/elven-observability/stack-observability-k8s/environments/elven-distribution-release \
            --jq '.protection_rules | any(.type == "required_reviewers" and (.reviewers | length > 0))' \
            | grep -qx true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: elven-instrumentation-oci
          path: artifacts/instrumentation
      - name: Install checksum-pinned registry client
        run: |
          crane_url=$(python3 -c 'import json; print(json.load(open("instrumentation.lock.json"))["tools"]["crane"]["linuxAmd64"]["url"])')
          crane_sha=$(python3 -c 'import json; print(json.load(open("instrumentation.lock.json"))["tools"]["crane"]["linuxAmd64"]["sha256"])')
          mkdir -p "$RUNNER_TEMP/elven-sdk-tools"
          curl --fail --location --retry 3 "$crane_url" --output "$RUNNER_TEMP/elven-sdk-tools/crane.tar.gz"
          printf '%s  %s\n' "$crane_sha" "$RUNNER_TEMP/elven-sdk-tools/crane.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/elven-sdk-tools/crane.tar.gz" -C "$RUNNER_TEMP/elven-sdk-tools" crane
          echo "$RUNNER_TEMP/elven-sdk-tools" >> "$GITHUB_PATH"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Refuse missing scoped registry credentials
        env:
          REGISTRY_USER: ${{ secrets.ELVEN_DOCKERHUB_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.ELVEN_DOCKERHUB_TOKEN }}
        run: test -n "$REGISTRY_USER" && test -n "$REGISTRY_TOKEN"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: docker.io
          username: ${{ secrets.ELVEN_DOCKERHUB_USERNAME }}
          password: ${{ secrets.ELVEN_DOCKERHUB_TOKEN }}
      - name: Preflight immutable tags, publish exact scanned bytes and verify GitHub OIDC signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/images-instrumentation.py publish
          python3 scripts/images-instrumentation.py promote
      - name: Preserve verified independent SDK promotion candidate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elven-instrumentation-promotion
          path: artifacts/instrumentation/*.json
          if-no-files-found: error
          retention-days: 30
