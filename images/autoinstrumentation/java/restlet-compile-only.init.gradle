// Build-only source reconstructions. Never a repository for customer libraries.
// Exact coordinates/versions only, on the six projects that already declare
// Central + the old Restlet endpoint + mavenLocal in the pinned upstream source.
// Do not create project repositories elsewhere: that hides settings repositories
// under Gradle's PREFER_PROJECT default (including the Central BOMs).
allprojects {
    if (path in [
        ':instrumentation:restlet:restlet-1.1:javaagent',
        ':instrumentation:restlet:restlet-1.1:library',
        ':instrumentation:restlet:restlet-1.1:testing',
        ':instrumentation:restlet:restlet-2.0:javaagent',
        ':instrumentation:restlet:restlet-2.0:library',
        ':instrumentation:restlet:restlet-2.0:testing'
    ]) {
      repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'elvenRestletSourceRebuild'
                    url = uri('/opt/elven-restlet-maven')
                }
            }
            filter {
                includeVersion('org.restlet', 'org.restlet', '1.1.5')
                includeVersion('com.noelios.restlet', 'com.noelios.restlet', '1.1.5')
                includeVersion('org.restlet.jse', 'org.restlet', '2.0.2')
            }
        }
      }
    }
}
