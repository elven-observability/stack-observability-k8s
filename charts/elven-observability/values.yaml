# Replace example-cluster. The CLI rejects example identity before installation.
cluster:
  name: example-cluster
  environment: production
  domain: cluster.local
fullnameOverride: ""
images:
  collector:
    # Public signed Elven release; exact source, digests and predicates are locked.
    # Never substitute upstream or unverified development images.
    repository: "docker.io/elvenobservability/elven-collector"
    tag: "v1.0.1"
    digest: "sha256:d6cb61db477227ed6b6bb673a43ba87dd2c893a61c6eb3febfeda3476ae398e4"
    pullPolicy: IfNotPresent
  beyla:
    repository: "docker.io/elvenobservability/elven-ebpf"
    tag: "v1.0.1"
    digest: "sha256:68cd44f1aeafce7305a555e124f9687b1760db62bf7ea3e81e7d67af4f538f62"
    pullPolicy: IfNotPresent
  alloy:
    repository: "docker.io/elvenobservability/elven-profiler"
    tag: "v1.0.1"
    digest: "sha256:f22e2e8099706ea1cec50d0fced8a7747598fe24956752df200dd5bff2eb3c1d"
    pullPolicy: IfNotPresent
imagePullSecrets: []
credentials:
  existingSecret: elven-ingest
tls:
  existingSecret: elven-internal-tls
endpoints:
  logs: https://loki.elvenobservability.com/otlp/v1/logs
  metrics: https://mimir.elvenobservability.com/otlp/v1/metrics
  traces: https://tempo.elvenobservability.com/http/v1/traces
  # Optional backend: require a real, independently qualified HTTPS endpoint.
  # No guessed public hostname is shipped for a service that is not provisioned.
  profiles: ""
exportTLS:
  # Optional private export CA supplied as a separate Secret, key ca.crt.
  existingCASecret: ""
ports:
  otlpGrpc: 4317
  otlpHttp: 4318
  health: 13133
  metrics: 8888
  localOtlpHttp: 14318
gateway:
  # This release candidate supports a singleton only; it does not claim HA.
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
    ephemeralSizeLimit: 1Gi
  queueSizeBytes: 20971520
  terminationGracePeriodSeconds: 120
  pdb:
    enabled: false
nodeAgent:
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}
  nodeSelector: {}
  # Optional legacy-compatible exact scope. The MCP contract requires names
  # bound to observed node UIDs; a label selector is not a node identity.
  approvedNodes: []
  tolerations: []
  # Only reviewed, static node DNS mappings; prefer real platform DNS.
  hostAliases: []
  terminationGracePeriodSeconds: 60
clusterMetrics:
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}
profiles:
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}
collection:
  # Explicit opt-in; never discovers/scrapes client prometheus.io annotations.
  namespaces: []
modules:
  logs:
    enabled: false
    hostAccessApproved: false
  clusterMetrics:
    enabled: false
    clusterWideApproved: false
  kubeletMetrics:
    enabled: false
    port: 10250
    # hostname verifies a serving certificate with a node-name DNS SAN.
    endpointAddress: ip
    caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    caSecretName: ""
  ebpf:
    enabled: false
    hostAccessApproved: false
    # Prefer the SDK for an already instrumented process. Disable only for an
    # explicit overlap experiment; dual HTTP spans are not extra coverage.
    excludeSDKInstrumentedServices: true
    # Approved normalized templates; unmatched paths collapse to a wildcard.
    routePatterns: []
    # Separate from the Collector: kernel/program startup can peak well above
    # steady RSS. Measure one worker before scaling; this is not a sizing SLA.
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
    # Distribution floor: Linux >=5.11 with BTF. No automatic SYS_ADMIN fallback.
    additionalCapabilities: []
    additionalCapabilitiesApproved: false
    workloads: []
  profiles:
    enabled: false
    # Raw pprof frames/labels bypass OTLP sanitization and have no durable WAL.
    # Approve the source data policy explicitly before enabling collection.
    dataPolicyApproved: false
    targets: []
privacy:
  # Selective masking preserves useful text, JSON and sanitized SQL structure.
  # It detects known patterns, not arbitrary PII. Review your source-data policy.
  # strict replaces complete log bodies; legacy redact aliases selective.
  logBodyMode: selective
  # Link attributes pass through the same recursive sanitizer; IDs are retained.
  preserveSpanLinks: true
  # Deprecated compatibility field; no longer bypasses link sanitization.
  spanLinkAttributesApproved: false
  # Exceeding a bound masks the affected subtree instead of forwarding it raw.
  # AnyValue maps add several protobuf nesting levels per logical level.
  # Keep the complete exported envelope below common 100-level wire limits.
  maxDepth: 24
  maxStringBytes: 262144
  maxCollectionItems: 4096
networkPolicy:
  enabled: true
  dnsNamespace: kube-system
  dnsPort: 53
  dnsPodLabels: {k8s-app: kube-dns}
  dnsCIDRs: []
  # Must be populated from reviewed real destinations; empty denies the traffic.
  exportCIDRs: []
  exportPorts: [443]
  apiServerCIDRs: []
  apiServerPorts: [443, 6443]
  kubeletCIDRs: []
  profileCIDRs: []
  profilePorts: [443]
selfMonitoring:
  enabled: true
  interval: 30s
podAnnotations: {}
nodeSelector: {}
tolerations: []
