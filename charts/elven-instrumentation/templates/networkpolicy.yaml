{{- if and .Values.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "elvenInjection.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elvenInjection.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "elvenInjection.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.apiServerCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ .Values.webhook.port }}}
  # The operator needs neither Kubernetes API credentials nor network egress.
  egress: []
{{- end }}
